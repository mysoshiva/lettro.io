<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lettro - Letter Translator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="text-center">Lettro</h1>
    <p class="text-center">Upload or scan a letter to translate and simplify it.</p>

    <!-- Image Upload -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Upload Letter</h5>
        <input type="file" id="letterUpload" accept="image/*" class="form-control mb-2">
        <button id="captureBtn" class="btn btn-primary">Use Camera</button>
        <button id="scanBtn" class="btn btn-success mt-2">Scan Letter</button>
        <div id="imagePreview" class="mt-2"></div>
      </div>
    </div>

    <!-- Target Language -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title">Target Language</h5>
        <select id="targetLanguage" class="form-select">
          <option value="en">English</option>
          <option value="de">German</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
        </select>
      </div>
    </div>

    <!-- Results -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Results</h5>
        <div id="results" class="mt-2">
          <p>Upload or scan a letter to see the results here.</p>
        </div>
      </div>
    </div>

    <!-- History -->
    <button id="historyBtn" class="btn btn-info mt-4">View History</button>
    <div id="historyDiv" class="mt-4" style="display: none;">
      <h3>Scan History</h3>
      <div id="historyList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
